stages:
  - test
  - sonarqube-check
  - build
  - docker
  - deploy

variables:
  JAVA_VERSION: "11"

Run tests:
  stage: test
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn clean test -DfailIfNoTests=false -Dtest=*Test,*Spec
  tags:
    - maven

Build for test server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${FRM_HPL_TEST_MAVEN_LOCAL_PROPERTIES_DIR} -Dmaven.test.skip=true clean package -U
    - docker build -t "${FRM_HPL_TEST_DOCKER_BACKEND_IMAGE}" .
    - docker push "${FRM_HPL_TEST_DOCKER_BACKEND_IMAGE}"
    - docker image rm "${FRM_HPL_TEST_DOCKER_BACKEND_IMAGE}"
  tags:
    - maven
  when: manual

Build for production server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${FRM_HPL_PROD_MAVEN_LOCAL_PROPERTIES_DIR} -Dmaven.test.skip=true clean package -U
    - docker build -t "${FRM_HPL_PROD_DOCKER_BACKEND_IMAGE}" .
    - docker push "${FRM_HPL_PROD_DOCKER_BACKEND_IMAGE}"
    - docker image rm "${FRM_HPL_PROD_DOCKER_BACKEND_IMAGE}"
  tags:
    - maven
  when: manual

Build for Wrocław ON production server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${FRM_HPL_PROD2_MAVEN_LOCAL_PROPERTIES_DIR} -Dmaven.test.skip=true clean package -U
    - docker build -t "${FRM_HPL_PROD2_DOCKER_BACKEND_IMAGE}" .
    - docker push "${FRM_HPL_PROD2_DOCKER_BACKEND_IMAGE}"
    - docker image rm "${FRM_HPL_PROD2_DOCKER_BACKEND_IMAGE}"
  tags:
    - maven
  when: manual

Deploy on test server:
  stage: deploy
  script:
    - docker-compose -p ${FRM_HPL_TEST_CONTAINER_NAME} pull
    - set +e && docker-compose -p ${FRM_HPL_TEST_CONTAINER_NAME} stop && set -e
    - docker-compose -p ${FRM_HPL_TEST_CONTAINER_NAME} up -d
  tags:
    - qs1-server
  when: manual

Deploy on Wrocław ON prod server:
  stage: deploy
  script:
#    - ${FRM_HPL_PROD_DB_DUMP_SCRIPT_DIR}
    - docker pull "${FRM_HPL_PROD2_DOCKER_BACKEND_IMAGE}"
    - docker ps -aq --filter "name=${FRM_HPL_PROD2_CONTAINER_NAME}" | grep -q . && docker stop "${FRM_HPL_PROD2_CONTAINER_NAME}" && docker rm "${FRM_HPL_PROD2_CONTAINER_NAME}"
    - docker run -d --network="bridge" -p ${FRM_HPL_PROD2_PORT}:8080 -v ${FRM_HPL_PROD2_LOCAL_RUNTIME_PROP_DIR}:/opt/local.runtime.properties -v DMS:/DMS --name "${FRM_HPL_PROD2_CONTAINER_NAME}" "${FRM_HPL_PROD2_DOCKER_BACKEND_IMAGE}"
  tags:
    - hpl-prod
  when: manual


SonarQube analysis:
  stage: sonarqube-check
  image: maven:3-adoptopenjdk-11-openj9
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.qualitygate.wait=true
  allow_failure: true
  only:
    - merge_requests
  tags:
    - ops03-docker-executor
